name: CI

on:
  push:
    branches: [Dev]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Check generated data
        run: |
          pnpm data
          git diff --exit-code -- data

      - name: Package lint, build and attw
        run: pnpm lint:package

      - name: Size budget
        run: pnpm size

      - name: Smoke test the bundle
        run: pnpm smoke
